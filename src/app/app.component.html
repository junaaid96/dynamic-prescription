<div class="flex h-screen bg-gray-50">
  <!-- Left Panel - Controls -->
  <!-- Add this new section library panel before the existing controls -->
  <div class="w-80 border-r bg-white p-4 overflow-y-auto shadow-sm">
    <div class="space-y-6">
      <!-- Section Library -->
      <div class="bg-white border border-gray-200 rounded-lg shadow-sm">
        <div class="p-4 border-b border-gray-200">
          <h3 class="text-lg font-semibold text-gray-900 flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
            </svg>
            Section Library
          </h3>
        </div>
        <div class="p-4">
          <div class="grid grid-cols-2 gap-2">
            <button *ngFor="let sectionType of availableSectionTypes" 
                    (click)="addSection(sectionType.id)"
                    class="p-3 border border-gray-200 rounded-lg hover:bg-blue-50 hover:border-blue-300 transition-colors text-left">
              <div class="text-sm font-medium text-gray-900">{{ sectionType.name }}</div>
              <div class="text-xs text-gray-500 mt-1">Click to add</div>
            </button>
          </div>
        </div>
      </div>
      
      <!-- Sections List -->
      <div class="bg-white border border-gray-200 rounded-lg shadow-sm">
        <div class="p-4 border-b border-gray-200">
          <h3 class="text-lg font-semibold text-gray-900">Sections ({{ sections.length }})</h3>
        </div>
        <div class="p-4 space-y-2">
          <div *ngFor="let section of sections" 
               class="flex items-center justify-between p-2 border rounded-lg hover:bg-gray-50"
               [class.bg-blue-50]="selectedSection?.id === section.id"
               [class.border-blue-300]="selectedSection?.id === section.id">
            <div class="flex-1 cursor-pointer" (click)="selectSection(section)">
              <div class="text-sm font-medium">{{ section.type | titlecase }}</div>
              <div class="text-xs text-gray-500 truncate">{{ section.content.split('\n')[0] }}</div>
            </div>
            <div class="flex gap-1">
              <button (click)="duplicateSection(section)" 
                      class="p-1 text-gray-400 hover:text-blue-600" title="Duplicate">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                </svg>
              </button>
              <button (click)="deleteSection(section.id)" 
                      class="p-1 text-gray-400 hover:text-red-600" title="Delete">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Paper Size Configuration -->
      <div class="bg-white border border-gray-200 rounded-lg shadow-sm">
        <div class="p-4 border-b border-gray-200">
          <h3 class="text-lg font-semibold text-gray-900 flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            Paper Configuration
          </h3>
        </div>
        <div class="p-4 space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Paper Size</label>
            <select [(ngModel)]="selectedPaperSize" (change)="onPaperSizeChange()" 
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <option value="A4">A4 (210 × 297 mm)</option>
              <option value="A5">A5 (148 × 210 mm)</option>
              <option value="Letter">Letter (8.5 × 11 in)</option>
              <option value="Legal">Legal (8.5 × 14 in)</option>
              <option value="Custom">Custom</option>
            </select>
          </div>
          
          <div *ngIf="selectedPaperSize === 'Custom'" class="space-y-3">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Width (mm)</label>
              <input type="number" [(ngModel)]="customSize.width" (input)="onCustomSizeChange()"
                     class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Height (mm)</label>
              <input type="number" [(ngModel)]="customSize.height" (input)="onCustomSizeChange()"
                     class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
          </div>
        </div>
      </div>

      <!-- Section Editor -->
      <div *ngIf="selectedSection" class="bg-white border border-gray-200 rounded-lg shadow-sm">
        <div class="p-4 border-b border-gray-200">
          <h3 class="text-lg font-semibold text-gray-900">Section Editor</h3>
          <p class="text-sm text-gray-600 mt-1">Editing: {{ selectedSection.type | titlecase }}</p>
        </div>
        <div class="p-4 space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Content</label>
            <textarea [(ngModel)]="selectedSection.content" (input)="updateSection()"
                      rows="4" 
                      class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none">
            </textarea>
          </div>
          
          <!-- Tabs for Position, Size, Style -->
          <div class="border-b border-gray-200">
            <nav class="-mb-px flex space-x-8">
              <button *ngFor="let tab of tabs" 
                      (click)="activeTab = tab"
                      [class]="activeTab === tab ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'"
                      class="whitespace-nowrap py-2 px-1 border-b-2 font-medium text-sm">
                {{ tab }}
              </button>
            </nav>
          </div>
          
          <!-- Tab Content -->
          <div [ngSwitch]="activeTab" class="space-y-3">
            <!-- Position Tab -->
            <div *ngSwitchCase="'Position'" class="space-y-3">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">X Position (%): {{ selectedSection.position.x.toFixed(1) }}</label>
                <input type="range" [(ngModel)]="selectedSection.position.x" (input)="updateSection()"
                       min="0" max="95" step="0.1"
                       class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Y Position (%): {{ selectedSection.position.y.toFixed(1) }}</label>
                <input type="range" [(ngModel)]="selectedSection.position.y" (input)="updateSection()"
                       min="0" max="95" step="0.1"
                       class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
              </div>
            </div>
            
            <!-- Size Tab -->
            <div *ngSwitchCase="'Size'" class="space-y-3">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Width (%): {{ selectedSection.size.width }}</label>
                <input type="range" [(ngModel)]="selectedSection.size.width" (input)="updateSection()"
                       min="10" max="100" step="1"
                       class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Height (%): {{ selectedSection.size.height }}</label>
                <input type="range" [(ngModel)]="selectedSection.size.height" (input)="updateSection()"
                       min="5" max="80" step="1"
                       class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
              </div>
            </div>
            
            <!-- Style Tab -->
            <div *ngSwitchCase="'Style'" class="space-y-3">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Font Size: {{ selectedSection.style.fontSize }}px</label>
                <input type="range" [(ngModel)]="selectedSection.style.fontSize" (input)="updateSection()"
                       min="8" max="24" step="1"
                       class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Text Align</label>
                <select [(ngModel)]="selectedSection.style.textAlign" (change)="updateSection()"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                  <option value="left">Left</option>
                  <option value="center">Center</option>
                  <option value="right">Right</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Padding: {{ selectedSection.style.padding }}px</label>
                <input type="range" [(ngModel)]="selectedSection.style.padding" (input)="updateSection()"
                       min="0" max="30" step="1"
                       class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Margin: {{ selectedSection.style.margin }}px</label>
                <input type="range" [(ngModel)]="selectedSection.style.margin" (input)="updateSection()"
                       min="0" max="20" step="1"
                       class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Template Actions -->
      <div class="bg-white border border-gray-200 rounded-lg shadow-sm">
        <div class="p-4 border-b border-gray-200">
          <h3 class="text-lg font-semibold text-gray-900">Template Actions</h3>
        </div>
        <div class="p-4 space-y-2">
          <button (click)="saveTemplate()" 
                  class="w-full bg-gray-800 text-white px-4 py-2 rounded-md hover:bg-gray-700 transition-colors flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
            Save Template
          </button>
          <button (click)="exportToPDF()" 
                  class="w-full bg-purple-600 text-white px-4 py-2 rounded-md hover:bg-purple-700 transition-colors flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
            Export to PDF
          </button>
          <div>
            <input type="file" accept=".json" (change)="loadTemplate($event)" 
                   style="display: none" #fileInput>
            <button (click)="fileInput.click()" 
                    class="w-full bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-50 transition-colors flex items-center justify-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
              </svg>
              Load Template
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Panel - Preview -->
  <div class="flex-1 p-4 bg-gray-100">
    <div class="h-full flex items-center justify-center">
      <div #previewContainer
           class="bg-white shadow-lg relative border border-gray-300"
           [style.width.px]="600"
           [style.height.px]="(600 * currentPaperSize.height) / currentPaperSize.width"
           style="max-height: 90vh;">
        
        <div *ngFor="let section of sections; trackBy: trackBySection"
             class="absolute border-2 cursor-move transition-all duration-200"
             [class.border-blue-500]="selectedSection?.id === section.id"
             [class.bg-blue-50]="selectedSection?.id === section.id"
             [class.border-gray-300]="selectedSection?.id !== section.id"
             [style.left.%]="section.position.x"
             [style.top.%]="section.position.y"
             [style.width.%]="section.size.width"
             [style.height.%]="section.size.height"
             [style.font-size.px]="section.style.fontSize"
             [style.font-weight]="section.style.fontWeight"
             [style.text-align]="section.style.textAlign"
             [style.padding.px]="section.style.padding"
             [style.margin.px]="section.style.margin"
             (click)="selectSection(section)"
             cdkDrag
             (cdkDragEnded)="onDragEnded($event, section)">
          
          <div class="flex items-center justify-between p-1 bg-gray-100 border-b border-gray-200 text-xs text-gray-600">
            <span>{{ section.type | titlecase }}</span>
            <svg class="w-3 h-3 cursor-move" fill="currentColor" viewBox="0 0 20 20">
              <path d="M10 6a2 2 0 110-4 2 2 0 010 4zM10 12a2 2 0 110-4 2 2 0 010 4zM10 18a2 2 0 110-4 2 2 0 010 4z"></path>
            </svg>
          </div>
          
          <div class="p-2 whitespace-pre-wrap overflow-hidden text-sm">
            {{ section.content }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
