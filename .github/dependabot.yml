version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
      dev-dependencies:
        dependency-type: development
        exclude-patterns: ["@angular/*", "@angular-devkit/*"]
      dependencies:
        dependency-type: production
        exclude-patterns: ["@angular/*", "@angular-devkit/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
