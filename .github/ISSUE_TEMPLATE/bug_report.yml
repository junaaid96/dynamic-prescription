name: Bug report
description: Something is broken or prints in the wrong place
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please do not include real patient information. Use demo names only."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, expected vs actual behaviour.
    validations:
      required: true
  - type: input
    id: pad
    attributes:
      label: Pad size and type
      placeholder: "A5, pre-printed letterhead"
  - type: input
    id: env
    attributes:
      label: Browser, OS and printer
      placeholder: "Chrome 140, Windows 11, HP LaserJet"
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or a photo of the print
